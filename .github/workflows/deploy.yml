name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: rm -rf docs dist

      - run: bun run build

      - name: Generate CV, README and LinkedIn
        run: bunx @jannael/devsync build
        continue-on-error: true

      - run: cp -r dist docs

      - name: Commit generated artifacts
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'docs: auto-update artifacts from DEVSYNC.json [skip ci]'
          file_pattern: ':!DEVSYNC.json'
